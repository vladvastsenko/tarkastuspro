name: Tarkastus Pro authenticated APK
on:
  workflow_dispatch:
concurrency:
  group: cloud-authenticated-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Premium server policy
        run: |
          node --check premium-server/index.js
          node --test premium-server/*.test.js
      - name: Check Firebase secret availability
        env:
          PRO_GOOGLE_SERVICES_JSON: ${{ secrets.PRO_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$PRO_GOOGLE_SERVICES_JSON" || { echo "::error::Missing PRO_GOOGLE_SERVICES_JSON"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify supplied Pro artwork
        run: |
          cmp icon1.png app/src/main/res/drawable/icon.png
          cmp tarkastuspro1.png app/src/main/res/drawable/tarkastuscloud.png
      - run: python3 scripts/check-cloud-locales.py
      - name: Validate Firebase configuration
        env:
          PRO_GOOGLE_SERVICES_JSON: ${{ secrets.PRO_GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          test -n "$PRO_GOOGLE_SERVICES_JSON" || { echo "::error::Missing PRO_GOOGLE_SERVICES_JSON"; exit 1; }
          umask 077
          printf '%s' "$PRO_GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 scripts/check-firebase.py
      - name: Build with dedicated Cloud signing key when configured
        env:
          PRO_KEYSTORE_B64: ${{ secrets.PRO_KEYSTORE_B64 }}
          CLOUD_KEYSTORE_PASSWORD: ${{ secrets.PRO_KEYSTORE_PASSWORD }}
          CLOUD_KEY_ALIAS: ${{ secrets.PRO_KEY_ALIAS }}
        run: |
          set -eu
          if [ -n "$PRO_KEYSTORE_B64" ]; then
            test -n "$CLOUD_KEYSTORE_PASSWORD"
            test -n "$CLOUD_KEY_ALIAS"
            export CLOUD_KEYSTORE_PATH="$RUNNER_TEMP/cloud-signing.p12"
            umask 077
            printf '%s' "$PRO_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$CLOUD_KEYSTORE_PATH"
            printf 'CLOUD_KEYSTORE_PATH=%s\n' "$CLOUD_KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "::error::Missing permanent Cloud signing key"; exit 1
          fi
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon -PofflinePreview=false -PpremiumCheckout=false -PproductionAds=false; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Android PDF export
        env:
          CLOUD_KEYSTORE_PASSWORD: ${{ secrets.PRO_KEYSTORE_PASSWORD }}
          CLOUD_KEY_ALIAS: ${{ secrets.PRO_KEY_ALIAS }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: gradle :app:connectedDebugAndroidTest --no-daemon -PofflinePreview=false -PpremiumCheckout=false -PproductionAds=false -Pandroid.testInstrumentationRunnerArguments.class=fi.vladi.valvontapoytakirja.CustomPdfExportTest,fi.vladi.valvontapoytakirja.ValvontaRepositoryTest
      - name: Publish Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Verify APK signature and record certificate
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          for apk in app/build/outputs/apk/debug/*.apk; do
            test -f "$apk"
            "$signer" verify --verbose --print-certs "$apk" | tee "$apk.cert.txt"
            sha256sum "$apk" > "$apk.sha256"
          done
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cloud-signing.p12"
      - name: Publish unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: Tarkastus-Pro-Authenticated-Developer
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.cert.txt
            app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
