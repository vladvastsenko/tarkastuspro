name: Tarkastus Cloud authenticated APK
on:
  workflow_dispatch:
  push:
    branches: [rename-staging]
concurrency:
  group: cloud-authenticated-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Premium server policy
        run: |
          node --check premium-server/index.js
          node --test premium-server/*.test.js
      - name: Check Firebase secret availability
        env:
          CLOUD_GOOGLE_SERVICES_JSON: ${{ secrets.CLOUD_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$CLOUD_GOOGLE_SERVICES_JSON" || { echo "::error::Missing CLOUD_GOOGLE_SERVICES_JSON"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Import verified original Cloud artwork
        env:
          SOURCE_REF: 80f845a203da9ed0484ce597426a5f9b10156756
        run: |
          set -eu
          base="https://raw.githubusercontent.com/vladvastsenko/valvontapoytakirja/$SOURCE_REF/app/src/main/res/drawable-nodpi"
          curl --fail --location --retry 3 "$base/tarkastus_cloud_icon.png" -o app/src/main/res/drawable/icon.png
          curl --fail --location --retry 3 "$base/welcome.png" -o app/src/main/res/drawable/tarkastuscloud.png
          test "$(git hash-object app/src/main/res/drawable/icon.png)" = "5cc6c36cc4fefafd909761376aed8367c642a226"
          test "$(git hash-object app/src/main/res/drawable/tarkastuscloud.png)" = "169df2b38aa2dbe8afee0cf96481bf1653afff9a"
          file app/src/main/res/drawable/icon.png app/src/main/res/drawable/tarkastuscloud.png
          python3 -c 'from pathlib import Path; assert all(Path(p).read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a")) for p in ["app/src/main/res/drawable/icon.png","app/src/main/res/drawable/tarkastuscloud.png"])'
      - run: python3 scripts/check-cloud-locales.py
      - name: Validate Firebase configuration
        env:
          CLOUD_GOOGLE_SERVICES_JSON: ${{ secrets.CLOUD_GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          test -n "$CLOUD_GOOGLE_SERVICES_JSON" || { echo "::error::Missing CLOUD_GOOGLE_SERVICES_JSON"; exit 1; }
          umask 077
          printf '%s' "$CLOUD_GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 scripts/check-firebase.py
      - name: Build with dedicated Cloud signing key when configured
        env:
          CLOUD_KEYSTORE_B64: ${{ secrets.CLOUD_KEYSTORE_B64 }}
          CLOUD_KEYSTORE_PASSWORD: ${{ secrets.CLOUD_KEYSTORE_PASSWORD }}
          CLOUD_KEY_ALIAS: ${{ secrets.CLOUD_KEY_ALIAS }}
        run: |
          set -eu
          if [ -n "$CLOUD_KEYSTORE_B64" ]; then
            test -n "$CLOUD_KEYSTORE_PASSWORD"
            test -n "$CLOUD_KEY_ALIAS"
            export CLOUD_KEYSTORE_PATH="$RUNNER_TEMP/cloud-signing.p12"
            umask 077
            printf '%s' "$CLOUD_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$CLOUD_KEYSTORE_PATH"
            printf 'CLOUD_KEYSTORE_PATH=%s\n' "$CLOUD_KEYSTORE_PATH" >> "$GITHUB_ENV"
          else
            echo "::error::Missing permanent Cloud signing key"; exit 1
          fi
          for attempt in 1 2 3; do
            if gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon -PofflinePreview=false -PpremiumCheckout=false -PproductionAds=false; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real Android PDF export
        env:
          CLOUD_KEYSTORE_PASSWORD: ${{ secrets.CLOUD_KEYSTORE_PASSWORD }}
          CLOUD_KEY_ALIAS: ${{ secrets.CLOUD_KEY_ALIAS }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: gradle :app:connectedDebugAndroidTest --no-daemon -PofflinePreview=false -PpremiumCheckout=false -PproductionAds=false -Pandroid.testInstrumentationRunnerArguments.class=fi.vladi.valvontapoytakirja.CustomPdfExportTest
      - name: Publish Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/outputs/androidTest-results/
          if-no-files-found: warn
      - name: Verify APK signature and record certificate
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          for apk in app/build/outputs/apk/debug/*.apk; do
            test -f "$apk"
            "$signer" verify --verbose --print-certs "$apk" | tee "$apk.cert.txt"
            grep -Ei "^[[:space:]]*(Signer #1|V[0-9]+ Signer:) ?certificate SHA-256 digest: 5ae050fda66bdd28efbd178c811fceb3aeb3669c0f8a0b6ae8e279c6a87612d7[[:space:]]*$" "$apk.cert.txt" || { echo "::error::Unexpected Cloud signing certificate"; exit 1; }
            grep -Ei "^[[:space:]]*(Signer #1|V[0-9]+ Signer:) ?certificate SHA-1 digest: ecd6ce941543e92ea89938ef13f2185a9395eaaf[[:space:]]*$" "$apk.cert.txt" || { echo "::error::Unexpected Cloud SHA-1"; exit 1; }
            sha256sum "$apk" > "$apk.sha256"
          done
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cloud-signing.p12"
      - name: Publish unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: Tarkastus-Cloud-Authenticated-Developer
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.cert.txt
            app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
