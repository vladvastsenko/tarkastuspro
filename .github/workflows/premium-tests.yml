name: Tarkastus Cloud Premium server tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check premium-server/index.js
      - run: node --test premium-server/policy.test.js
