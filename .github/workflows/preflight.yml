name: Cloud Firebase preflight (no APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate independent Firebase configuration
        env:
          CLOUD_GOOGLE_SERVICES_JSON: ${{ secrets.CLOUD_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$CLOUD_GOOGLE_SERVICES_JSON" || { echo "::error::Missing CLOUD_GOOGLE_SERVICES_JSON"; exit 1; }
          printf '%s' "$CLOUD_GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 scripts/check-firebase.py
      - name: Compile Kotlin and resources without packaging APK
        run: gradle :app:compileDebugKotlin :tarkastus:compileDebugKotlin --no-daemon
