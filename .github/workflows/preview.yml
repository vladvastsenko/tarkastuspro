name: Tarkastus Cloud Preview APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Import verified original Cloud artwork
        env:
          SOURCE_REF: 80f845a203da9ed0484ce597426a5f9b10156756
        run: |
          set -eu
          base="https://raw.githubusercontent.com/vladvastsenko/valvontapoytakirja/$SOURCE_REF/app/src/main/res/drawable-nodpi"
          curl --fail --location --retry 3 "$base/tarkastus_cloud_icon.png" -o app/src/main/res/drawable/icon.png
          curl --fail --location --retry 3 "$base/welcome.png" -o app/src/main/res/drawable/tarkastuscloud.png
          test "$(git hash-object app/src/main/res/drawable/icon.png)" = "5cc6c36cc4fefafd909761376aed8367c642a226"
          test "$(git hash-object app/src/main/res/drawable/tarkastuscloud.png)" = "169df2b38aa2dbe8afee0cf96481bf1653afff9a"
          file app/src/main/res/drawable/icon.png app/src/main/res/drawable/tarkastuscloud.png
          python3 -c 'from pathlib import Path; assert all(Path(p).read_bytes().startswith(bytes.fromhex("89504e470d0a1a0a")) for p in ["app/src/main/res/drawable/icon.png","app/src/main/res/drawable/tarkastuscloud.png"])'
      - run: python3 scripts/check-cloud-locales.py
      - name: Build with dedicated Cloud signing key when configured
        env:
          CLOUD_KEYSTORE_B64: ${{ secrets.CLOUD_KEYSTORE_B64 }}
          CLOUD_KEYSTORE_PASSWORD: ${{ secrets.CLOUD_KEYSTORE_PASSWORD }}
          CLOUD_KEY_ALIAS: ${{ secrets.CLOUD_KEY_ALIAS }}
        run: |
          set -eu
          if [ -n "$CLOUD_KEYSTORE_B64" ]; then
            test -n "$CLOUD_KEYSTORE_PASSWORD"
            test -n "$CLOUD_KEY_ALIAS"
            export CLOUD_KEYSTORE_PATH="$RUNNER_TEMP/cloud-signing.p12"
            umask 077
            printf '%s' "$CLOUD_KEYSTORE_B64" | base64 --decode > "$CLOUD_KEYSTORE_PATH"
            trap 'rm -f "$CLOUD_KEYSTORE_PATH"' EXIT
          else
            echo "::warning::No permanent Cloud signing key configured; debug APK may not update previous builds."
          fi
          gradle :app:testDebugUnitTest :app:assembleDebug -PofflinePreview=true --no-daemon
      - name: Verify APK signature and record certificate
        run: |
          set -euo pipefail
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          for apk in app/build/outputs/apk/debug/*.apk; do
            "$signer" verify --verbose --print-certs "$apk" | tee "$apk.cert.txt"
            sha256sum "$apk" > "$apk.sha256"
          done
      - name: Publish unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: Tarkastus-Cloud-0.1.0-Preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.cert.txt
            app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
